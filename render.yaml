services:
  - type: web
    name: stockery
    runtime: node
    plan: free
    # Locked at creation and not changeable afterwards: a different region
    # means a new service. Frankfurt to sit near the Neon project.
    region: frankfurt
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      # Neon's unpooled connection string (Connect > untick "Connection
      # pooling"), with &connect_timeout=30 so a suspended compute has time to
      # wake. Only the Prisma CLI uses it; migrations cannot run through the
      # connection pooler.
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
